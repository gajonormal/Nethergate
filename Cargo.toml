[package]
name = "nethergated"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Local Minecraft server manager for Nethergate"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
getrandom = "0.2"
hmac = "0.12"
roxmltree = "0.20"
time = { version = "0.3", features = ["formatting"] }
flate2 = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_Security"] }
